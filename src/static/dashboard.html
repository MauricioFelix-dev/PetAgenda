<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - PetAgenda</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ── RESET & VARIÁVEIS ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --cream:   #FAF6EF;
            --green:   #2D5016;
            --amber:   #C8861A;
            --white:   #FFFFFF;
            --text:    #2A2318;
            --muted:   #7A6A58;
            --shadow:  0 4px 12px rgba(0,0,0,0.05);
            --radius:  12px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--cream);
            color: var(--text);
            padding-bottom: 40px;
        }

        /* ── CABEÇALHO ATUALIZADO ── */
        header {
            background-color: var(--green);
            color: var(--white);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .header-direita {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nome-usuario {
            font-weight: 600;
            font-size: 0.95rem;
            color: #E8A030;
        }

        .btn-voltar {
            color: var(--white);
            background: transparent;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-voltar:hover { background-color: rgba(255,255,255,0.1); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .secao-titulo { margin-bottom: 24px; font-size: 1.8rem; color: var(--green); }
        .grid-agendamentos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

        .card {
            background: var(--white); border-radius: var(--radius); padding: 24px;
            box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
            border-top: 4px solid var(--amber);
        }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .tutor-nome { font-size: 1.2rem; font-weight: 600; color: var(--green); }

        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        .status-Pendente { background-color: #FFF3CD; color: #856404; }
        .status-Concluído { background-color: #D4EDDA; color: #155724; border-top-color: #28a745; }
        .status-Cancelado { background-color: #F8D7DA; color: #721C24; opacity: 0.7; }

        .info-linha { font-size: 0.95rem; }
        .info-linha strong { color: var(--muted); }
        .obs-box { background-color: #F8F9FA; padding: 12px; border-radius: 8px; font-size: 0.85rem; color: var(--muted); font-style: italic; }
        .vazio { text-align: center; color: var(--muted); padding: 40px; font-size: 1.2rem; grid-column: 1 / -1; }

        .card-acoes { display: flex; gap: 8px; margin-top: 8px; border-top: 1px solid #eee; padding-top: 16px; }
        .btn-acao {
            flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: 0.2s; color: var(--white);
        }
        .btn-concluir { background-color: #28a745; }
        .btn-concluir:hover { background-color: #218838; }
        .btn-cancelar { background-color: #dc3545; }
        .btn-cancelar:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <header>
        <h1>🐾 PetAgenda | Painel Administrativo</h1>
        <div class="header-direita">
            <span id="displayNome" class="nome-usuario"></span>
            <button onclick="fazerLogout()" class="btn-voltar">Sair da Conta</button>
        </div>
    </header>

    <div class="container">
        <h2 class="secao-titulo">Agendamentos Recentes</h2>
        <div id="lista-agendamentos" class="grid-agendamentos">
            <p class="vazio">⏳ Carregando dados do servidor...</p>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. O CADEADO DE SEGURANÇA
        // ==========================================
        // Vai no "bolso" do navegador procurar a credencial
        const crachaString = sessionStorage.getItem('usuarioLogado');

        // Se não existir crachá, expulsa para o login IMEDIATAMENTE!
        if (!crachaString) {
            window.location.href = 'login.html';
        }

        // ==========================================
        // 2. INICIALIZAÇÃO DA PÁGINA
        // ==========================================
        // Se o código chegou até aqui, é porque a pessoa está logada!
        // Vamos transformar o crachá (que está em texto) num Objeto Javascript
        const usuarioLogado = JSON.parse(crachaString);

        document.addEventListener('DOMContentLoaded', () => {
            // Mostra o nome do usuário no canto superior direito
            document.getElementById('displayNome').textContent = 'Olá, ' + usuarioLogado.nome;
            
            // Busca os agendamentos no banco de dados
            buscarAgendamentos();
        });

        // ==========================================
        // 3. FUNÇÃO DE LOGOUT (SAIR)
        // ==========================================
        function fazerLogout() {
            // Pergunta se tem certeza
            if(confirm("Deseja realmente sair do sistema?")) {
                sessionStorage.removeItem('usuarioLogado'); // Tira o crachá do bolso
                window.location.href = 'login.html';        // Manda de volta para a porta da rua
            }
        }

        // ==========================================
        // LÓGICA DE BUSCAR E ATUALIZAR AGENDAMENTOS
        // ==========================================
        function buscarAgendamentos() {
            fetch('http://localhost:8080/api/agendamentos')
                .then(resposta => resposta.json())
                .then(dados => {
                    const container = document.getElementById('lista-agendamentos');
                    container.innerHTML = ''; 

                    if (dados.length === 0) {
                        container.innerHTML = '<p class="vazio">Nenhum agendamento encontrado.</p>';
                        return;
                    }

                    dados.forEach(item => {
                        const dataObj = new Date(item.dataHora);
                        const dataFormatada = dataObj.toLocaleDateString('pt-BR');
                        const horaFormatada = dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                        const obsHTML = item.observacoes ? `<div class="obs-box">📝 "${item.observacoes}"</div>` : '';

                        let botoesHTML = '';
                        if (item.status === 'Pendente') {
                            botoesHTML = `
                                <div class="card-acoes">
                                    <button class="btn-acao btn-concluir" onclick="mudarStatus(${item.id}, 'Concluído')">✓ Concluir</button>
                                    <button class="btn-acao btn-cancelar" onclick="mudarStatus(${item.id}, 'Cancelado')">✕ Cancelar</button>
                                </div>
                            `;
                        }

                        const cardHTML = `
                            <div class="card" style="${item.status === 'Concluído' ? 'border-top-color: #28a745;' : item.status === 'Cancelado' ? 'border-top-color: #dc3545;' : ''}">
                                <div class="card-header">
                                    <div class="tutor-nome">${item.tutor}</div>
                                    <div class="badge status-${item.status}">${item.status}</div>
                                </div>
                                <div class="info-linha"><strong>Pet:</strong> ${item.pet}</div>
                                <div class="info-linha"><strong>Serviço:</strong> ${item.servico}</div>
                                <div class="info-linha"><strong>Telefone:</strong> ${item.telefone}</div>
                                <div class="info-linha"><strong>Data:</strong> ${dataFormatada} às ${horaFormatada}</div>
                                ${obsHTML}
                                ${botoesHTML}
                            </div>
                        `;

                        container.innerHTML += cardHTML;
                    });
                })
                .catch(erro => console.error('Erro:', erro));
        }

        function mudarStatus(idAgendamento, novoStatus) {
            if (!confirm(`Tem certeza que deseja marcar este agendamento como ${novoStatus}?`)) return;

            fetch(`http://localhost:8080/api/agendamento/${idAgendamento}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: novoStatus })
            })
            .then(resposta => {
                if (resposta.ok) {
                    buscarAgendamentos(); 
                } else {
                    alert("Erro ao atualizar o status.");
                }
            })
            .catch(erro => console.error('Erro ao atualizar:', erro));
        }
    </script>
</body>
</html>
