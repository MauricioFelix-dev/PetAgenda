<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%232D5016%27/%3E%3Cg fill=%27%23F2B544%27%3E%3Cellipse cx=%2732%27 cy=%2740%27 rx=%2711%27 ry=%279.5%27/%3E%3Ccircle cx=%2718%27 cy=%2728%27 r=%275.5%27/%3E%3Ccircle cx=%2726.5%27 cy=%2718%27 r=%275.5%27/%3E%3Ccircle cx=%2737.5%27 cy=%2718%27 r=%275.5%27/%3E%3Ccircle cx=%2746%27 cy=%2728%27 r=%275.5%27/%3E%3C/g%3E%3C/svg%3E">
    <title>Login - PetAgenda</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cream:   #FAF6EF;
            --green:   #2D5016;
            --amber:   #C8861A;
            --white:   #FFFFFF;
            --text:    #2A2318;
            --shadow:  0 8px 30px rgba(45,80,22,0.15);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background:
                radial-gradient(ellipse 60% 50% at 80% 20%, rgba(74,124,47,.14) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 15% 85%, rgba(200,134,26,.12) 0%, transparent 70%),
                var(--cream);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-box {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--green);
            margin: 0 0 8px;
        }
        .logo span { color: var(--amber); }

        .subtitulo {
            color: #7A6A58;
            font-size: 0.95rem;
            margin: 0 0 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #8C8C8C; /* #ddd tinha só 1,36:1; este tem 3,36:1 (WCAG 1.4.11) */
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--green); }
        input:focus-visible, .btn-login:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
        .btn-login:disabled { opacity: .7; cursor: wait; }

        .btn-login {
            width: 100%;
            background-color: var(--green);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover { background-color: #4A7C2F; }

        .mensagem-erro {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <main class="login-box">
        <h1 class="logo">Pet<span>Agenda</span></h1>
        <p class="subtitulo">Acesso restrito para funcionários</p>

        <form id="formLogin">
            <div class="form-group">
                <label for="login">Login de usuário</label>
                <input type="text" id="login" autocomplete="username" placeholder="Ex: admin" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-login" id="btnEntrar">Entrar no sistema</button>
            <!-- role="alert": o leitor de tela anuncia o erro assim que ele aparece -->
            <div id="mensagemErro" class="mensagem-erro" role="alert"></div>
        </form>
        <p style="margin-top:24px;font-size:.9rem;"><a href="/" style="color:var(--green);font-weight:600;">← Voltar para a página inicial</a></p>
    </main>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            const loginDigitado = document.getElementById('login').value;
            const senhaDigitada = document.getElementById('senha').value;
            const msgErro = document.getElementById('mensagemErro');
            const btn = document.getElementById('btnEntrar');

            // Limpa o erro anterior e mostra que está processando (heurística H1)
            msgErro.style.display = 'none';
            msgErro.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            function mostrarErro(texto) {
                msgErro.textContent = texto;
                msgErro.style.display = 'block';
            }

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: loginDigitado, senha: senhaDigitada })
            })
            .then(resposta => {
                if (resposta.ok) {
                    return resposta.json().then(dadosUsuario => {
                        // O controle de acesso real é a sessão no servidor; aqui guardamos só o nome para exibir
                        sessionStorage.setItem('usuarioLogado', JSON.stringify(dadosUsuario));
                        window.location.href = 'dashboard.html';
                    });
                }
                // Mensagens diferentes para causas diferentes (heurística H9 de Nielsen)
                if (resposta.status === 401) {
                    mostrarErro('Login ou senha incorretos. Confira e tente de novo.');
                } else {
                    mostrarErro('O servidor teve um problema (erro ' + resposta.status + '). Tente novamente em instantes.');
                }
            })
            .catch(() => {
                mostrarErro('Não foi possível falar com o servidor. Verifique se o sistema está ligado.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'Entrar no sistema';
            });
        });
    </script>
</body>
</html>
