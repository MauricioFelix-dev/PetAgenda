# ==========================================
# 1. CONFIGURAÇÃO DO BANCO DE DADOS (MYSQL)
# ==========================================
# Aqui informamos o endereço do banco. "3306" é a porta padrão do MySQL e "petagenda" é o nome do seu banco.
spring.datasource.url=jdbc:mysql://localhost:3306/petagenda?serverTimezone=America/Sao_Paulo&useSSL=false

# O seu usuário do banco de dados (o padrão local geralmente é root)
spring.datasource.username=root

# A senha do seu banco de dados (se você usa XAMPP, geralmente é vazia. Se usar outro, coloque a senha aqui)
spring.datasource.password=

# O "motorista" (driver) que ensina o Java a conversar com o MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. CONFIGURAÇÃO DO SERVIDOR WEB
# ==========================================
# Define que o nosso back-end Java vai rodar na porta 8080 (a mesma que você colocou no seu JavaScript!)
server.port=8080

# ==========================================
# 3. REGRAS DO PETAGENDA
# ==========================================
# Quantos atendimentos podem acontecer ao mesmo tempo (ex.: 2 se houver dois banhistas).
# Com 1, o sistema não permite nenhum atendimento sobreposto.
petagenda.capacidade-simultanea=1

# ==========================================
# 4. COOKIE DA SESSÃO (revisão de 21/11/2026)
# ==========================================
# HttpOnly: o JavaScript da página não consegue ler o cookie (dificulta roubo de sessão).
# SameSite=Lax: o navegador não envia o cookie em pedidos vindos de outros sites.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
